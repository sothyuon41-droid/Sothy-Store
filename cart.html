<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,shopping_bag" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href = "../css/header.css">
    <link rel="stylesheet" href = "../css/cart.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="navbar">
                <div class="logo">
                    <a href="./index.html">Sothy Store</a>
                </div>
                <div class="menu">
                    <nav id="menuItem">
                        <a href="./index.html">Home</a>
                        <a href="./products.html">Products</a>
                        <a href="./about.html">About</a>
                        <a href="./contact.html">Contact</a>
                    </nav>
                    <a href="./cart.html"><span class="shopping-icon material-symbols-outlined">shopping_bag</span></a>
                    <button id="btnToggle" type="button" aria-label="Toggle navigation" aria-controls="mobile-navbar" aria-expanded="false"><span class="material-symbols-outlined">menu</span></button>
                </div>
            </div>
            <nav id="mobile-navbar">
                <a href="./index.html">Home</a>
                <a href="./products.html">Products</a>
                <a href="./about.html">About</a>
                <a href="./contact.html">Contact</a>
            </nav>
        </div>
    </div>

    <div class="small-container cart-page">
        <h1 class="cart-title">Your Shopping Cart</h1>
        <div class="cart-table-wrap">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="info">
                                <img src="../image/product1.webp" alt="T-shirt">
                                <div class="product-details">
                                    <p class="product-name">T-Shirt</p>
                                    <small>Price: $5</small>
                                    <a href="">Remove</a>
                                </div>
                            </div>
                        </td>
                        <td><input type="number" min="1" value="1" aria-label="T-shirt quantity"></td>
                        <td class="price">$5.00</td>
                    </tr>
                    <tr>
                        <td>
                            <div class="info">
                                <img src="../image/product1.webp" alt="T-shirt">
                                <div class="product-details">
                                    <p class="product-name">T-Shirt</p>
                                    <small>Price: $5</small>
                                    <a href="">Remove</a>
                                </div>
                            </div>
                        </td>
                        <td><input type="number" min="1" value="1" aria-label="T-shirt quantity"></td>
                        <td class="price">$5.00</td>
                    </tr>
                    <tr>
                        <td>
                            <div class="info">
                                <img src="../image/product1.webp" alt="T-shirt">
                                <div class="product-details">
                                    <p class="product-name">T-Shirt</p>
                                    <small>Price: $5</small>
                                    <a href="">Remove</a>
                                </div>
                            </div>
                        </td>
                        <td><input type="number" min="1" value="1" aria-label="T-shirt quantity"></td>
                        <td class="price">$5.00</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="total-price">
            <table>
                <tr>
                    <td>Subtotal</td>
                    <td>$15.00</td>
                </tr>
                <tr>
                    <td>Tax</td>
                    <td>$5.00</td>
                </tr>
                <tr class="grand-total">
                    <td>Total</td>
                    <td>$20.00</td>
                </tr>
            </table>
        </div>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
