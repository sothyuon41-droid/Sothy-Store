<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,shopping_bag" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href = "../css/header.css">
    <link rel="stylesheet" href = "../css/contact.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="navbar">
                <div class="logo">
                    <a href="./index.html">Sothy Store</a>
                </div>
                <div class="menu">
                    <nav id="menuItem">
                        <a href="./index.html">Home</a>
                        <a href="./products.html">Products</a>
                        <a href="./about.html">About</a>
                        <a href="./contact.html">Contact</a>
                    </nav>
                    <a href="./cart.html"><span class="shopping-icon material-symbols-outlined">shopping_bag</span></a>
                    <button id="btnToggle" type="button" aria-label="Toggle navigation" aria-controls="mobile-navbar" aria-expanded="false"><span class="material-symbols-outlined">menu</span></button>
                </div>
            </div>
            <nav id="mobile-navbar">
                <a href="./index.html">Home</a>
                <a href="./products.html">Products</a>
                <a href="./about.html">About</a>
                <a href="./contact.html">Contact</a>
            </nav>
        </div>
    </div>

    <div class="small-container">
        <h1 class="tittle">Contact Us</h1>
        <form id="contactForm" class="contact">
            <div class="mb-3">
                <label for="fullName">Full Name</label>
                <input id="fullName" name="fullName" type="text" placeholder="Your Full Name" required>
            </div>

            <div class="mb-3">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Your Email" required>
            </div>

            <div class="mb-3">
                <label for="phone">Phone Number</label>
                <input id="phone" name="phone" type="tel" placeholder="Your Phone Number">
            </div>

            <div class="mb-3">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type Your Message here..."></textarea>
            </div>

            <div class="mb-3">
                <button type="submit" class="btn">Send Message</button>
            </div>
        </form>
    </div>

     <div class="footer">
            <p class="copyright">Copy right 2026 - Sothy Store</p>
        </div>
    <script src="../js/main.js"></script>
</body>
</html>
